name = "corvmc"
compatibility_date = "2025-11-07"
compatibility_flags = ["nodejs_compat"]
# The deployed entry is a thin wrapper that re-exports the adapter-generated
# worker and adds the `scheduled` handler for the [triggers] below. The adapter
# writes its output to .svelte-kit/cloudflare/_worker.js per wrangler.adapter.toml
# (it rimrafs whatever `main` points at in the config it reads, so it must not
# read this file — see svelte.config.js).
main = "worker.js"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# Native cron triggers, handled by the `scheduled` export in worker.js, which
# dispatches in-process to the /api/cron/* endpoints (see
# src/lib/server/cron/schedule.ts for the expression → endpoint map — keep the
# two in sync). Times are UTC only (no DST), so Pacific wall-clock times shift
# an hour twice a year.
[triggers]
crons = [
  "*/5 * * * *",  # send-campaigns
  "*/15 * * * *", # auto-complete, complete-shifts, cancel-unconfirmed, expire-waitlisted, wake-snoozed
  "0 16 * * *",   # daily batch, 8am PST / 9am PDT, in order:
                  #   generate-recurring-reservations, lock-access,
                  #   confirmation-reminders, reservation-reminders,
                  #   cancel-stale-tickets, shift-reminders, shift-feedback
]

# ---------------------------------------------------------------------------
# Single deploy target — deploys as `corvmc` (corvmc.devon-cash.workers.dev)
# via `wrangler deploy`.
# ---------------------------------------------------------------------------

# Zone routes for the production domain, including the wildcard that serves
# premium band sites at {slug}.corvmc.org (rerouted to /band-site/{slug} by
# src/hooks.ts). Requires a proxied wildcard DNS record (*.corvmc.org) in the
# zone. media.corvmc.org is the R2 bucket's custom domain — R2 custom-domain
# routes take precedence over Worker routes, so it is not intercepted; verify
# after the first deploy.
[[routes]]
pattern = "corvmc.org/*"
zone_name = "corvmc.org"

[[routes]]
pattern = "www.corvmc.org/*"
zone_name = "corvmc.org"

[[routes]]
pattern = "*.corvmc.org/*"
zone_name = "corvmc.org"

# Premium bands' own domains (theband.com) arrive as Cloudflare for SaaS custom
# hostnames. Worker routes match on the request's Host, which for those requests
# is the band's domain — NOT anything under corvmc.org — so none of the patterns
# above fire and the request would fall through to the fallback origin, which is
# originless (AAAA 100::) and answers nothing. A wildcard-host route is what
# Cloudflare's "Workers as your fallback origin" guide prescribes for a Worker
# that is itself the origin:
# https://developers.cloudflare.com/cloudflare-for-platforms/cloudflare-for-saas/start/advanced-settings/worker-as-origin/
#
# Scoped to this zone, so it covers corvmc.org hostnames and the custom hostnames
# attached to it — nothing else. media.corvmc.org was already inside *.corvmc.org/*
# and still resolves to R2 (custom-domain routes win); re-verify after deploying.
[[routes]]
pattern = "*/*"
zone_name = "corvmc.org"

[vars]
# ORIGIN is required — better-auth uses it as baseURL and throws if unset
# (src/lib/server/auth.ts). Differs per environment.
ORIGIN = "https://corvmc.org"
R2_PUBLIC_URL = "https://media.corvmc.org"
# Canonical public site URLs (used for links in emails/notifications) + email
# sender name. Non-secret config.
PUBLIC_SITE_URL = "https://corvmc.org"
EMAIL_FROM_NAME = "CorvMC"
EMAIL_FROM_ADDRESS = "noreply@corvmc.org"
STAFF_CONTACT_EMAIL = "contact@corvmc.org"
# Postmark message streams. Custom streams, not Postmark's defaults
# (`outbound`/`broadcast`) — both must exist with these exact ids on the server
# POSTMARK_SERVER_TOKEN belongs to. Required: sends throw when either is unset.
POSTMARK_TRANSACTIONAL_STREAM = "outbound"
POSTMARK_BROADCAST_STREAM = "broadcast"
# Base address for inbox reply routing. Staff replies go out with a plus-addressed
# Reply-To (reply+<threadId>.<sig>@...) so the response threads back into the same
# conversation via Postmark's MailboxHash.
#
# This also gates the contact-form alert's relay: a staff member can answer the
# alert straight from their mail client and the inbox both delivers the reply to
# the sender and records it on the thread.
#
# Depends on MX replies.corvmc.org -> inbound.postmarkapp.com, which is live. Do
# NOT move this to corvmc.org itself, which receives real mail on Google Workspace.
# Unsetting it is the rollback: replies fall back to Reply-To: STAFF_CONTACT_EMAIL,
# which reaches a human instead of bouncing. Setup and troubleshooting:
# docs/architecture/inbox-reply-setup.md
INBOX_REPLY_ADDRESS = "reply@replies.corvmc.org"
# Public Cloudflare Turnstile site key for the bot-protection widget on the public
# sign-up, contact, and subscribe forms. Non-secret. The matching secret is the
# TURNSTILE_SECRET_KEY Worker secret (set via `wrangler secret put`). The value
# below is Cloudflare's always-pass test key; replace with the real site key.
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADkKhGrOdNGAT-pY"
# Legacy Laravel app (Forge-hosted, currently served at corvmc.org) — used for
# bcrypt password verification during the migration window; drops out after cutover.
LARAVEL_URL = "https://corvmcorg-x68glzpd.on-forge.com"
# Cloudflare Image Transformations. The base is the bucket's custom domain plus
# the fixed /cdn-cgi/image prefix; getPublicUrl appends the option segment and
# the R2 key. Requires "Resize images from this zone" enabled on the corvmc.org
# zone — the code path is inert until this var is set, so enable the zone setting
# first and verify with:
#   curl -sI 'https://media.corvmc.org/cdn-cgi/image/width=200,format=auto/<key>'
# Verified live on 2026-08-16: transformations are enabled on the zone and
# /cdn-cgi/image/ IS intercepted on the R2 custom domain, so the source stays a
# bare key. A 462KB JPEG poster returns 19.8KB of AVIF at width=200.
R2_TRANSFORM_URL = "https://media.corvmc.org/cdn-cgi/image"
# The apex zone (https://corvmc.org/cdn-cgi/image) also works and is the fallback
# if the R2 custom domain ever stops intercepting; it needs an absolute source,
# which is what R2_TRANSFORM_SOURCE_ABSOLUTE switches on. No code change either way.
# Intentionally unset: TWILIO_PHONE_NUMBER, R2_TRANSFORM_SOURCE_ABSOLUTE.

[[d1_databases]]
binding = "DB"
database_name = "corvmc-db"
database_id = "e43655a1-10ca-4c03-965c-d0c3bd77c0ae"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "corvmc"

[[kv_namespaces]]
binding = "KV"
id = "fc85459046fe47f9bbfae4f343012041"

# Exposes the deploy version id (on process.env.CF_VERSION_METADATA) so Sentry
# can tag events with a release. Auto-detected by @sentry/cloudflare >= 10.35.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Native Cloudflare automatic tracing (open beta). Exports OTel traces + logs to
# Sentry over OTLP, adding platform-level spans (D1 queries, KV/R2 ops, subrequests)
# that the Sentry SDK can't see. The destination names below must match the OTLP
# destinations created in the Cloudflare dashboard (Workers & Pages > Observability
# > Destinations).
[observability.traces]
enabled = true
destinations = ["sentry-traces"]
# head_sampling_rate = 1   # default 1 = trace every request; lower for high traffic
# persist = false          # set false to export to Sentry only (skips CF storage billing)

[observability.logs]
enabled = true
destinations = ["sentry-logs"]
