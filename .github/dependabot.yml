# Dependency updates.
#
# The repo had no config at all after the move to corvmc/corvmc.org: the PRs
# dependabot had already opened survived, but the entry behind them did not, so
# it would neither rebase them nor open anything new ("The dependabot.yml entry
# that created this PR has been deleted"). This restores it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Every bump has to clear the same gates a hand-written PR does, and the E2E
    # job is the slow one. Ten at a time is about what the merge queue can chew
    # through in a week without starving real work of runners.
    open-pull-requests-limit: 10
    ignore:
      # rc.5 types nested column groups from union/generic table params as
      # nullable (#1769, #1771). Take 1.0.0 stable instead; a `-<hash>` build
      # suffix sorts above rc.6 in semver, so only a range this wide catches them.
      - dependency-name: drizzle-orm
        versions: ['>1.0.0-rc.3 <1.0.0']
      - dependency-name: drizzle-kit
        versions: ['>1.0.0-rc.3 <1.0.0']
      # Moves with @sentry/sveltekit, which bundles its own copy; a lone major
      # splits @sentry/core (#1768). Drop this when sveltekit goes to 11.
      - dependency-name: '@sentry/cloudflare'
        update-types: ['version-update:semver-major']
    groups:
      # One PR per ecosystem-shaped cluster rather than per package. These move
      # together in lockstep and a lone bump inside a group usually fails to
      # install, so splitting them costs CI time and merges nothing.
      svelte:
        patterns:
          - '@sveltejs/*'
          - svelte
          - svelte-*
          - vite
          - '@vitejs/*'
      # Named in full for the same reason as `testing` below: in #1763/#1767 the
      # glob missed and the addons moved to 10.6.1 in minor-and-patch while core
      # moved alone here, a skew that fails Unit tests on a missing export.
      storybook:
        patterns:
          - storybook
          - '@storybook/*'
          - '@storybook/addon-a11y'
          - '@storybook/addon-docs'
          - '@storybook/addon-svelte-csf'
          - '@storybook/addon-vitest'
          - '@storybook/sveltekit'
          - eslint-plugin-storybook
      cloudflare:
        patterns:
          - wrangler
          - '@cloudflare/*'
          - miniflare
      # Named in full as well as by glob. In #1153 the three bare names grouped
      # and the three the globs should have caught did not, leaving
      # `@playwright/test` behind `playwright` — the split that kills e2e
      # collection with "did not expect test() to be called here" and reads like
      # a flake. Why the globs missed is not established (#1166); the explicit
      # names do not depend on the answer. Keep both lists in step when adding a
      # package. `@storybook/addon-vitest` belongs to the storybook group above.
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@vitest/browser-playwright'
          - '@vitest/coverage-v8'
          - playwright
          - '@playwright/*'
          - '@playwright/test'
          - vitest-browser-svelte
      linting:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - eslint-config-*
          - eslint-plugin-*
          - prettier
          - prettier-plugin-*
      # Everything else, split by risk: a patch train is usually safe to skim,
      # a major rarely is.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
