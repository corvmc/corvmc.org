name: Issue area guard

# Every issue carries an `area:` label so `gh issue list --label area:<vertical>` is a real
# query — the SessionStart hook prints that command, and `.claude/rules/` asks for it again when
# a file in a vertical is opened. Ten issues in a row arrived without one, because the path that
# files them cannot set one: `.github/ISSUE_TEMPLATE/finding.md` hardcodes the labels it knows
# in frontmatter, and an agent running `gh issue create --body` never sees a form.
#
# So the vocabulary is enforced after the fact rather than at the point of entry. A `needs-area`
# label is a queue someone can work, where a missing label is invisible.
on:
  issues:
    types: [opened, reopened, labeled, unlabeled]

permissions:
  issues: write

jobs:
  area:
    name: Require an area label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            // The payload's labels are the state at event time, which is what we want: a
            // `labeled` event fires with the new label already present.
            const labels = context.payload.issue.labels.map((l) => l.name);
            const hasArea = labels.some((n) => n.startsWith('area:'));
            const flagged = labels.includes('needs-area');

            if (hasArea === flagged) {
              await github.rest.issues[hasArea ? 'removeLabel' : 'addLabels']({
                owner,
                repo,
                issue_number,
                ...(hasArea ? { name: 'needs-area' } : { labels: ['needs-area'] })
              });
            }
