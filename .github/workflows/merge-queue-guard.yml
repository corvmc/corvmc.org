name: Merge queue guard

# A PR queued with `gh pr merge --auto` and then rejected by the queue loses its
# auto-merge: GitHub disarms it and nothing is left watching, so the PR sits open indefinitely
# while every check on its own head stays green. This leaves a durable signal instead — a
# `queue-rejected` label plus a comment naming what failed — so `/queue-triage` (or anyone
# reading the PR list) can pick it up later.
#
# It deliberately never re-arms auto-merge. Re-queueing is a decision, not a retry.
#
# `pull_request` workflows resolve from the PR's merge ref rather than from `main`, so a branch cut
# before this file landed has no guard until it takes `main`.
on:
  pull_request:
    types: [dequeued, enqueued]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  rejected:
    name: Report queue rejection
    # `dequeued` fires on every removal from the queue, including the successful merge that is
    # the whole point of queueing. Only an unmerged removal is a rejection.
    if: github.event.action == 'dequeued' && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only for `scripts/queue-guard-failures.mjs`, which renders the "What failed" block far
      # below — a file rather than more shell because CI YAML cannot be exercised by pushing.
      # `pull_request` already resolves this workflow from the PR's merge ref, so taking the
      # script from that same ref extends no trust the workflow file did not already extend.
      # No `setup-node`: the script is dependency-free ESM and the runner ships a node.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/queue-guard-failures.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Label and comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          # The webhook carries a removal reason, but its values are undocumented. Logged for
          # diagnosis, never branched on — the run lookup below is the source of truth.
          REASON: ${{ github.event.reason }}
        run: |
          set -euo pipefail
          echo "dequeue reason (informational): ${REASON:-<absent>}"

          gh label create queue-rejected \
            --color B60205 \
            --description 'Removed from the merge queue without merging' \
            --force

          # The queue ref (`gh-readonly-queue/main/pr-<n>-<sha>`) is deleted the moment the PR is
          # dequeued, so there is nothing left to look up by ref — and nothing to re-run either.
          # The run outlives the ref and is found by the branch name it recorded.
          #
          # `cancelled` is in the filter because that is what a job hitting its own
          # `timeout-minutes` produces — a run with no failing job that is still a build problem.
          # A run cancelled because its ref went away is cancelled too; they are told apart below.
          run=$(gh run list --event merge_group --limit 50 \
            --json databaseId,headBranch,conclusion,url \
            --jq "[.[] | select((.conclusion == \"failure\" or .conclusion == \"cancelled\" or .conclusion == \"timed_out\") and (.headBranch | contains(\"/pr-${PR}-\")))] | first")

          # How many times the queue has thrown this PR out. `.claude/agents/qc.md` treats
          # three or more as a real ordering bug rather than bad luck, so the number decides
          # whether re-queueing is even reasonable — put it in the comment so nobody has to
          # go and count. Counted by line rather than with jq's `length`, which `--paginate`
          # would evaluate once per page. This removal may not be in the timeline yet, so
          # treat it as a floor.
          ejections=$(gh api "repos/${GH_REPO}/issues/${PR}/timeline" --paginate \
            --jq '.[] | select(.event == "removed_from_merge_queue") | .event' | wc -l | tr -d ' ')

          if [ -z "$run" ] || [ "$run" = 'null' ]; then
            kind=none
          else
            id=$(jq -r '.databaseId' <<<"$run")
            url=$(jq -r '.url' <<<"$run")
            conclusion=$(jq -r '.conclusion' <<<"$run")

            # Fetched once and read three times: the names for the summary line, the ids for
            # the timeout probe and for the annotations below. A run can fail more than one
            # job at a time — pr-512 failed `Schema drift` and `Unit tests` together — so the
            # names are joined by jq rather than by `paste -d ', '`, which cycles through the
            # delimiter *list* and would space the separators differently for each pair.
            jobs=$(gh run view "$id" --json jobs)
            failed=$(jq -r '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' <<<"$jobs")

            # A job killed by its own `timeout-minutes` reports `cancelled`, indistinguishable
            # from a job cancelled because the queue ref was deleted under it. The one thing
            # separating them is the annotation the runner leaves on a timeout — `The job has
            # exceeded the maximum execution time of 30m0s` — so that annotation, not the
            # conclusion, is what promotes a cancelled run to a rejection. Accumulated in the
            # pipeline rather than with `paste -sd ', '`, for the delimiter-list reason above.
            timedout=$(
              jq -r '.jobs[] | select(.conclusion == "cancelled" or .conclusion == "timed_out")
                     | "\(.databaseId)\t\(.name)"' <<<"$jobs" |
              {
                acc=''
                while IFS=$'\t' read -r job name; do
                  [ -n "$job" ] || continue
                  limit=$(gh api "repos/${GH_REPO}/check-runs/${job}/annotations" \
                    --jq '[.[] | .message | capture("maximum execution time of (?<limit>\\S+)") | .limit] | first // empty' 2>/dev/null || true)
                  [ -n "$limit" ] || continue
                  acc="${acc:+${acc}, }${name} (${limit})"
                done
                printf '%s' "$acc"
              }
            )

            if [ -n "$failed" ]; then
              kind=failed
            elif [ -n "$timedout" ]; then
              kind=timeout
            elif [ "$conclusion" = 'cancelled' ]; then
              # Cancelled, nothing failed, nobody's clock ran out: the ref went away under a
              # still-running build — the queue reordered, or an earlier PR in the group failed
              # out. A supersede is not a verdict on this PR, so it stays in the quiet branch.
              kind=superseded
            else
              # A `failure`/`timed_out` run whose jobs all passed: the workflow itself, not a job.
              kind=failed
              failed='(no job reported a failure — the run itself did)'
            fi
          fi

          case "$kind" in
            none)
              cat > comment.md <<'EOF'
          ### Removed from the merge queue

          No `merge_group` CI run for this PR failed, timed out or was cancelled, so this was a
          manual removal, a merge conflict, or the queue's one-hour check timeout — not a failed
          build.
          EOF
              ;;
            superseded)
              cat > comment.md <<EOF
          ### Removed from the merge queue

          A \`merge_group\` run for this PR was cancelled, but no job failed and no job hit its own
          \`timeout-minutes\` — which is what a *superseded* build looks like: the queue ref was
          deleted while it was still running, because the queue reordered or an earlier PR in the
          group failed out. That is not a verdict on this PR.

          ${url}

          So the removal itself was a manual one, a merge conflict, or the queue's one-hour check
          timeout — not a failed build.
          EOF
              ;;
            timeout)
              cat > comment.md <<EOF
          ### Rejected by the merge queue — a job hung

          Killed by its own \`timeout-minutes\` on the queue ref, where this PR is tested against
          the queue head rather than against its own base: **${timedout}**

          ${url}

          Nothing failed an assertion, so the question is what the job was *waiting on* — a preview
          server that never bound, a browser that never exited, a lock nobody released — not which
          test broke. \`ci.yml\` sets these limits at roughly 2x the slowest run observed, so
          reaching one is a regression rather than a limit set too tight.

          The checks on this PR's own head can still be green — that is the point of the queue, and
          the reason this needs saying out loud.
          EOF
              ;;
            failed)
              cat > comment.md <<EOF
          ### Rejected by the merge queue

          Failed on the queue ref, where this PR is tested against the queue head rather than
          against its own base: **${failed}**

          ${url}

          The checks on this PR's own head can still be green — that is the point of the queue, and
          the reason this needs saying out loud.
          EOF
              ;;
          esac

          if [ "$kind" = 'failed' ] || [ "$kind" = 'timeout' ]; then
            # The failing tests, from GitHub's own annotations rather than from the log.
            # A job's id is its check-run id, so the annotations API takes it directly.
            # Parsing the log instead does not work: `--log-failed` ends in the runner's
            # credential teardown with the failure ~200 lines up, and the three jobs that
            # actually fail here (playwright, vitest, drizzle-kit) print three different
            # shapes. Annotations are uniform and already structured.
            #
            # Vitest emits them on its own under `GITHUB_ACTIONS`; Playwright does not, so
            # `playwright.config.ts` opts into the `github` reporter explicitly. A cancelled
            # job carries them too — the timed-out E2E on pr-548 named five specs — which is
            # why this filter matches the run filter rather than `failure` alone.
            #
            # Every annotation is handed over, not just the failure-level ones: Playwright
            # annotates only the first few numbered failures, and its `N failed` total arrives
            # as a *notice*. Dropping that total is how a run with 250 failures across 39 files
            # was reported as four band specs, and read as a shared-fixture bug (#794). Which
            # of them reach the comment, and what the comment says about the ones that do not,
            # is `scripts/queue-guard-failures.mjs` — where a spec can hold it to a real payload.
            annotations=$(
              jq -r '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .databaseId' <<<"$jobs" |
              while read -r job; do
                [ -n "$job" ] || continue
                gh api "repos/${GH_REPO}/check-runs/${job}/annotations" 2>/dev/null || echo '[]'
              done | jq -s 'add // []' | node scripts/queue-guard-failures.mjs || true
            )

            # `ci.yml`'s E2E job uploads `test-results/` on failure — traces, screenshots and
            # an `error-context.md` per failed test — and until now the comment linked the run
            # but never the artifact, so the paths the log names led nowhere. Kept 7 days, so
            # say when it goes.
            artifacts=$(
              gh api "repos/${GH_REPO}/actions/runs/${id}/artifacts" \
                --jq '.artifacts[] | select(.expired == false) | "\(.id)\t\(.name)"' 2>/dev/null |
                while IFS=$'\t' read -r aid aname; do
                  printf -- '- [%s](https://github.com/%s/actions/runs/%s/artifacts/%s)\n' \
                    "$aname" "$GH_REPO" "$id" "$aid"
                done
            )

            # Heading included — the renderer decides whether there is a section at all.
            if [ -n "$annotations" ]; then
              cat >> comment.md <<EOF

          ${annotations}
          EOF
            fi

            if [ -n "$artifacts" ]; then
              cat >> comment.md <<EOF

          **Failure artifacts** (traces, screenshots, \`error-context.md\` — kept 7 days)

          ${artifacts}
          EOF
            fi

            if [ "$ejections" -ge 3 ] 2>/dev/null; then
              cat >> comment.md <<EOF

          > This PR has now been removed from the queue **${ejections} times**. Past three,
          > \`.claude/agents/qc.md\` says to stop re-queueing and diagnose: a spec that fails on the
          > queue head and nowhere else is an ordering bug more often than it is noise.
          EOF
            fi
          fi

          cat >> comment.md <<'EOF'

          Auto-merge is disarmed and nothing will re-arm it. Run `/queue-triage` in a Claude
          session, or re-queue with `gh pr merge --auto`.
          EOF

          gh pr edit "$PR" --add-label queue-rejected
          gh pr comment "$PR" --body-file comment.md

  requeued:
    name: Clear rejection label
    # Keeps `gh pr list --label queue-rejected` a live worklist rather than a growing archive.
    if: github.event.action == 'enqueued'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove the label if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          # Not piped into grep: `grep -q` exits on the first match, and the SIGPIPE that hands
          # `gh` would fail the pipeline under `pipefail` exactly when the label *is* present.
          labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          # Removing a label the PR does not carry is a 404, and most enqueues are of PRs that
          # were never rejected.
          if grep -qx 'queue-rejected' <<<"$labels"; then
            gh pr edit "$PR" --remove-label queue-rejected
          fi
