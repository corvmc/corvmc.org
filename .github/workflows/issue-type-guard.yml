name: Issue type guard

# Every issue carries a type, so `Bug 1` in the SessionStart digest means what it says.
#
# It did not. `.github/ISSUE_TEMPLATE/finding.md` declares `type: Bug` in its frontmatter, and
# `gh issue create --template` applies that file's `labels:` while silently dropping its `type:`
# — there is a `--type` flag instead, which nothing was passing. So every agent-filed finding
# arrived untyped, including ones that turned out to be the most serious thing in the tracker,
# and the Bug count read 1 while several real defects were open.
#
# Flagged, not inferred. `agent-filed` looks like it should mean Bug and does not: the same
# label is on the walkthrough records, which are Tasks. A guess that is right most of the time
# is worse than a queue, because nobody rechecks a type that is already set. `needs-type` is
# something someone can work; a missing type is invisible. Same shape as the area guard.
on:
  issues:
    types: [opened, reopened, labeled, unlabeled, typed, untyped]

permissions:
  issues: write

jobs:
  type:
    name: Require an issue type
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            // Re-read rather than trusting `context.payload.issue`. One
            // `gh issue edit --type X --remove-label needs-type` fires two events, and
            // the `unlabeled` payload can carry the PRE-edit type while already
            // reflecting the label removal. That reads as `typed=false, flagged=false`,
            // the two agree, and the guard re-labels an issue that is now typed — seven
            // seconds after somebody took the label off (#1156).
            //
            // The area guard needs no such read: both of its facts come off the one
            // `labels` array, so its snapshot cannot disagree with itself.
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });

            const labels = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
            const typed = !!issue.type;
            const flagged = labels.includes('needs-type');

            if (typed === flagged) {
              await github.rest.issues[typed ? 'removeLabel' : 'addLabels']({
                owner,
                repo,
                issue_number,
                ...(typed ? { name: 'needs-type' } : { labels: ['needs-type'] })
              });
            }
