name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `main` merges through a merge queue: GitHub builds a `gh-readonly-queue/main/...`
  # ref holding main plus the queued PR(s) and merges only if the checks pass there.
  # Without this trigger the required checks never report and nothing ever leaves the
  # queue.
  merge_group:

# A new push supersedes the run already in flight for the same ref, so stale runs
# stop burning runner capacity that the replacement run then has to queue for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job sets `timeout-minutes`. Without it a job inherits GitHub's default of
# 360, so anything that wedges — a preview server that never binds, a browser
# that never exits — holds a runner for six hours and keeps auto-merge armed on
# a PR that is going nowhere.
#
# The numbers are roughly 2x the slowest run observed over the preceding weeks,
# not the median: E2E retries twice on CI (playwright.config.ts), so a run with
# a few flaky failures legitimately takes 3x a clean one. Observed maxima at the
# time of writing were E2E 14.8m and Unit tests 15.1m, against medians of 4.8m
# and 2.4m. These bound a hang; they are not a performance budget, and a job
# that starts timing out is reporting a real regression rather than a limit set
# too tight.

jobs:
  lint:
    name: Lint (full)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prettier only. `eslint --cache` is not usable here: caching makes ESLint
      # serialize its config, and svelte.config.js sets `compilerOptions.runes` to a
      # function (it exempts node_modules, .md/.svx and src/lib/layouts/prose.svelte
      # from runes mode), which ESLint refuses to serialize. ESLint is ~200s of this
      # job's ~250s, so this only caches the small half.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/prettier
          key: prettier-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            prettier-cache-${{ runner.os }}-
      - run: pnpm lint

  lint-changed:
    name: Lint (changed)
    # Everything except a push to `main`, which the full `lint` job above covers. This
    # must not be narrowed back to `pull_request`: "Lint (changed)" is a required check,
    # a job skipped by its `if:` reports success, and the queue would then merge code
    # nothing linted. `pnpm lint:changed` diffs against `origin/main`, an ancestor of the
    # queue ref, so the changed-file set is still right there.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git fetch origin main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:changed

  check:
    name: Svelte Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # `unit` and `e2e` were one `Test` job that ran them back to back. They share
  # nothing, so running them side by side halves the critical path. Deliberately no
  # `needs:` between them.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The `client` and `storybook` vitest projects run in real chromium.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # No `--with-deps` — see the note in the e2e job below.
      - run: pnpm exec playwright install chromium
      - run: pnpm run test:unit -- --run

  e2e-build:
    name: E2E build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This job exists for CORRECTNESS, not speed — do not fold it back into the
      # shards on a timing argument. It was tried: the build is 28s and a job's
      # fixed setup is 45s, so building per-shard is ~46s *faster* (190s against
      # 238s). It is also what broke the suite. `adapter-cloudflare`'s `emulate()`
      # calls `getPlatformProxy` on MINIFLARE_PERSIST_PATH from the build process
      # AND the preview process, and disposes neither, so a shard that builds puts
      # a second workerd over `.wrangler/e2e-state` moments before the server opens
      # it. On run 33110177599 that took the preview server down four seconds into
      # the run — 58 of 59 tests failed with ERR_CONNECTION_REFUSED behind:
      #
      #   *** Fatal uncaught kj::Exception: SENTRY_DO SQLite failed;
      #       database is locked: SQLITE_BUSY (extended: SQLITE_BUSY_RECOVERY)
      #
      # which is the whole-suite crash `e2e/prepare.ts` was split out to prevent,
      # and it is intermittent (the same job passed on re-run), so it fails a
      # required check and disarms auto-merge roughly half the time. Building here
      # keeps the shard's state directory to one writer: its own `prepare`.
      #
      # Nothing in `src/` reads `$env/static/*` — it is `$env/dynamic` throughout —
      # so no environment variable is baked in here, and each shard still supplies
      # ORIGIN, PUBLIC_SITE_URL and the rest at preview time via
      # playwright.config.ts. SENTRY_ENVIRONMENT is the exception, and is
      # build-time on purpose: it drops the Sentry vite plugin (see
      # vite.config.ts), which takes the output from 28MB to 11MB by not emitting
      # source maps nothing will ever read.
      - run: pnpm build
        env:
          SENTRY_ENVIRONMENT: ci
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-build
          # `.svelte-kit/cloudflare` is the adapter's deploy output; `vite preview`
          # serves from `.svelte-kit/output` and never reads it.
          path: |
            .svelte-kit
            !.svelte-kit/cloudflare
          retention-days: 1
          include-hidden-files: true

  e2e:
    # Not named "E2E": branch protection requires that context by exact name, and
    # a matrix job reports as "E2E shard 1"/"E2E shard 2". The `e2e-gate` job below
    # carries the required name. Renaming this without that job in place leaves the
    # required check permanently pending and every PR stuck in the merge queue.
    name: E2E shard ${{ matrix.shard }}
    needs: [e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A red shard must not cancel its sibling: half a result does not tell you
      # which tests actually failed.
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # Serve the downloaded build instead of making each shard produce its own.
      E2E_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # `--with-deps` is deliberately absent. The cache above restores the browsers
      # in ~4s; `--with-deps` then shells out to apt, which is cached by nothing and
      # re-run on every job. Measured on run 32301057462: 3m10s of pure apt with no
      # browser work at all — 36s of it stalled on the azure.archive.ubuntu.com
      # mirror — and the unit job on the same run sat here 14m41s before it was
      # cancelled. It installs fonts and libraries the ubuntu-24.04 runner image
      # already ships, and nothing here asserts on rendering.
      #
      # If a future runner image does drop a library, chromium fails to launch on
      # the first run rather than misbehaving quietly. The fix then is to restore
      # the apt path only where it can help:
      #
      #   - if: steps.pw-cache.outputs.cache-hit != 'true'
      #     run: pnpm exec playwright install --with-deps chromium
      #
      # which pays it when the Playwright version bumps, not on every push.
      - run: pnpm exec playwright install chromium
      - uses: actions/download-artifact@v4
        with:
          name: e2e-build
          path: .svelte-kit
      # Migrates and seeds this runner's own local D1. Split from the run below so
      # the two costs are separately visible in the step timings — they were one
      # opaque five-minute block, which is how a 64s migrate went unnoticed.
      - run: pnpm test:e2e:prepare
      # `test:e2e:run` rather than `test:e2e` so the flag reaches `playwright test`
      # and the prepare above stays its own step. pnpm forwards the `--` itself
      # rather than eating it; `e2e/run.ts` drops it, because `playwright test`
      # reads a bare `--` as a filename filter and exits with "No tests found".
      - run: pnpm test:e2e:run -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Carries the "E2E" context that branch protection requires, since the sharded
  # job above cannot. `needs.<matrix job>.result` is `success` only when every leg
  # succeeded; `e2e-build` is checked separately so a failed build reads as itself
  # rather than as the `skipped` the shards would report.
  e2e-gate:
    name: E2E
    needs: [e2e-build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the build and every shard
        run: |
          if [ "${{ needs.e2e-build.result }}" != "success" ]; then
            echo "::error::The E2E build failed; no shard ran."
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::One or more E2E shards failed."
            exit 1
          fi

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `check` catches migration collisions (two branches generating from the same
      # snapshot); `generate` diffs schema files against the committed snapshots, so
      # neither needs the CLOUDFLARE_* credentials that drizzle.config.ts references.
      - run: pnpm exec drizzle-kit check
      - name: Verify schema changes have a committed migration
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain migrations/)" ]; then
            git status --porcelain migrations/
            echo "::error::Schema changed without a migration. Run 'pnpm db:generate' and commit the result — Cloudflare deploys apply committed migrations only."
            exit 1
          fi
      # D1 ignores `PRAGMA foreign_keys=OFF` inside its migration transaction, so a
      # drizzle-generated table rebuild silently cascade-deletes the rebuilt table's
      # children. `pnpm db:generate` rewrites those automatically; this catches a
      # migration that was hand-written or generated with plain `drizzle-kit`.
      - name: Verify table rebuilds are safe on D1
        run: pnpm db:check-migrations

  docs:
    name: Docs integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No deps needed — the checker is plain Node. Fails only on integrity errors
      # (broken help links, duplicate slugs, bad frontmatter, orphaned static slugs);
      # route drift is informational here and handled by the nightly sync.
      - run: node scripts/docs/check-docs-drift.mjs --ci
