name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `main` merges through a merge queue: GitHub builds a `gh-readonly-queue/main/...`
  # ref holding main plus the queued PR(s) and merges only if the checks pass there.
  # Without this trigger the required checks never report and nothing ever leaves the
  # queue.
  merge_group:

# A new push supersedes the run already in flight for the same ref, so stale runs
# stop burning runner capacity that the replacement run then has to queue for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job sets `timeout-minutes`. Without it a job inherits GitHub's default of
# 360, so anything that wedges — a preview server that never binds, a browser
# that never exits — holds a runner for six hours and keeps auto-merge armed on
# a PR that is going nowhere.
#
# The numbers are roughly 2x the slowest run observed over the preceding weeks,
# not the median: E2E retries twice on CI (playwright.config.ts), so a run with
# a few flaky failures legitimately takes 3x a clean one. Observed maxima at the
# time of writing were E2E 14.8m and Unit tests 15.1m, against medians of 4.8m
# and 2.4m. These bound a hang; they are not a performance budget, and a job
# that starts timing out is reporting a real regression rather than a limit set
# too tight.

jobs:
  lint:
    name: Lint (full)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prettier only. `eslint --cache` is not usable here: caching makes ESLint
      # serialize its config, and svelte.config.js sets `compilerOptions.runes` to a
      # function (it exempts node_modules, .md/.svx and src/lib/layouts/prose.svelte
      # from runes mode), which ESLint refuses to serialize. ESLint is ~200s of this
      # job's ~250s, so this only caches the small half.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/prettier
          key: prettier-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            prettier-cache-${{ runner.os }}-
      - run: pnpm lint

  lint-changed:
    name: Lint (changed)
    # Everything except a push to `main`, which the full `lint` job above covers. This
    # must not be narrowed back to `pull_request`: "Lint (changed)" is a required check,
    # a job skipped by its `if:` reports success, and the queue would then merge code
    # nothing linted. On a `merge_group` run `pnpm lint:changed` diffs against
    # `origin/main`, an ancestor of the queue ref, so the changed-file set is still
    # right there.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A phase PR into an integration branch is diffed against that branch, not
    # against `main`. `github.base_ref` is the PR's base and is empty for
    # `merge_group`, whose ref is built from main — so the fallback keeps the
    # queue's behavior byte-identical to before.
    env:
      BASE_BRANCH: ${{ github.base_ref || 'main' }}
      BASE_REF: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git fetch origin "$BASE_BRANCH"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:changed

  check:
    name: Svelte Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm check` runs svelte-check over `src` — all the generated tsconfig
      # includes — and then `check:scripts` over `scripts/` and `e2e/`, which it
      # does not. Both are the same job rather than their own because each is a
      # few seconds of work on a checkout that is already installed, and the job
      # setup floor is ~45s.
      - run: pnpm check
      - run: pnpm check:tooling

  # `unit` and `e2e` were one `Test` job that ran them back to back. They share
  # nothing, so running them side by side halves the critical path. Deliberately no
  # `needs:` between them.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The `client` and `storybook` vitest projects run in real chromium.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # No `--with-deps` — see the note in the e2e job below.
      - run: pnpm exec playwright install chromium
      - run: pnpm run test:unit -- --run

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # `--with-deps` is deliberately absent. The cache above restores the browsers
      # in ~4s; `--with-deps` then shells out to apt, which is cached by nothing and
      # re-run on every job. Measured on run 32301057462: 3m10s of pure apt with no
      # browser work at all — 36s of it stalled on the azure.archive.ubuntu.com
      # mirror — and the unit job on the same run sat here 14m41s before it was
      # cancelled. It installs fonts and libraries the ubuntu-24.04 runner image
      # already ships, and nothing here asserts on rendering.
      #
      # If a future runner image does drop a library, chromium fails to launch on
      # the first run rather than misbehaving quietly. The fix then is to restore
      # the apt path only where it can help:
      #
      #   - if: steps.pw-cache.outputs.cache-hit != 'true'
      #     run: pnpm exec playwright install --with-deps chromium
      #
      # which pays it when the Playwright version bumps, not on every push.
      - run: pnpm exec playwright install chromium
      # Two steps rather than `pnpm test:e2e`, so the setup and the tests show up
      # separately in the step timings. As one opaque block, a migrate that had
      # grown to 64s went unnoticed for months.
      - run: pnpm test:e2e:prepare
      # Builds the app and serves it via playwright.config.ts's webServer.
      - run: pnpm test:e2e:run
      # The failure log names an `error-context.md` per failed test and, on a
      # retry, a trace. Without this step every one of those paths pointed at a
      # file that was deleted with the runner, so a red E2E could only be
      # triaged by guessing — and the races that fail here reproduce on a runner
      # and not on a laptop, which is the whole reason they are hard.
      #
      # `if: failure()` so a green run uploads nothing. `retention-days` is short
      # because these are only ever read while the run is still being triaged.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `check` catches migration collisions (two branches generating from the same
      # snapshot); `generate` diffs schema files against the committed snapshots, so
      # neither needs the CLOUDFLARE_* credentials that drizzle.config.ts references.
      - run: pnpm exec drizzle-kit check
      - name: Verify schema changes have a committed migration
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain migrations/)" ]; then
            git status --porcelain migrations/
            echo "::error::Schema changed without a migration. Run 'pnpm db:generate' and commit the result — Cloudflare deploys apply committed migrations only."
            exit 1
          fi
      # D1 ignores `PRAGMA foreign_keys=OFF` inside its migration transaction, so a
      # drizzle-generated table rebuild silently cascade-deletes the rebuilt table's
      # children. `pnpm db:generate` rewrites those automatically; this catches a
      # migration that was hand-written or generated with plain `drizzle-kit`.
      - name: Verify table rebuilds are safe on D1
        run: pnpm db:check-migrations

  docs:
    name: Docs integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No deps needed — the checker is plain Node. Fails only on integrity errors
      # (broken help links, duplicate slugs, bad frontmatter, orphaned static slugs);
      # route drift is informational here and handled by the nightly sync.
      - run: node scripts/docs/check-docs-drift.mjs --ci

  # `main` going red is the one CI outcome with nobody attached to it. A PR's red
  # run is watched by whoever opened it, and a rejected queue entry gets a label
  # and a comment from `merge-queue-guard.yml` — but a push to `main` that fails
  # notifies an email nobody reads, and the next person to look is the next person
  # to be confused by it. This leaves the same durable signal the queue guard
  # leaves: one issue per failing job, a comment per recurrence, closed by the
  # first green push.
  #
  # One issue per *job*, not per run: "Unit tests are broken on main" and "E2E is
  # broken on main" are two problems, and a run that fails both should not
  # collapse them into one thread. A recurrence comments rather than opening a
  # second issue.
  main-red:
    name: Track main going red
    # `always()` so this still runs when a dependency failed — that is the entire
    # point. `lint-changed` is absent from `needs` because it does not run on
    # push at all.
    if: always() && github.event_name == 'push'
    needs: [lint, check, unit, e2e, schema-drift, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Open, update or close the ci-failure issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          gh label create ci-failure \
            --color B60205 --description 'main is red — opened and closed by CI' --force

          # The display names, read back from the run rather than reconstructed
          # from the `needs` ids, so the issue title matches what the checks tab
          # shows. This job is still in progress and cannot appear in the list.
          failed=$(gh run view "$RUN_ID" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | .[]')

          open_issues=$(gh issue list --label ci-failure --state open --limit 50 \
            --json number,title)

          find_issue() {
            jq -r --arg t "$1" 'map(select(.title == $t)) | first | .number // empty' \
              <<<"$open_issues"
          }

          if [ -z "$failed" ]; then
            # A green push closes everything the red ones opened. Comment first:
            # a bare close loses which run vindicated it.
            jq -r '.[].number' <<<"$open_issues" | while read -r n; do
              [ -n "$n" ] || continue
              gh issue comment "$n" --body "Green again on \`${SHA:0:7}\` — ${RUN_URL}"
              gh issue close "$n" --reason completed
            done
            exit 0
          fi

          while IFS= read -r job; do
            [ -n "$job" ] || continue
            title="main is red: $job"
            existing=$(find_issue "$title")

            if [ -n "$existing" ]; then
              gh issue comment "$existing" \
                --body "Failed again on \`${SHA:0:7}\` — ${RUN_URL}"
              continue
            fi

            gh issue create --title "$title" --label ci-failure --body "$(cat <<EOF
          The **$job** job failed on a push to \`main\`.

          - Commit: \`${SHA}\`
          - Run: ${RUN_URL}

          Every recurrence is a comment on this issue, and the first fully green push
          to \`main\` closes it. If it is closed and reopens, the comment history is
          the record of how long it took.

          A red \`main\` blocks nothing mechanically — the merge queue tests each PR
          against the queue head, so PRs keep merging past it. That is exactly why
          this needs a place to sit rather than an email.
          EOF
          )"
          done <<<"$failed"
